name: Tests

on:
  push:
    branches: [main, "MT5_Quant_Agent_P0_Repaired_2026-08-04", "agent/*"]
  pull_request:
    branches: [main, "MT5_Quant_Agent_P0_Repaired_2026-08-04"]

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest psutil

      - name: Run unit tests (exclude runtime/replay/flaky)
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_end_to_end.py \
            --ignore=tests/test_performance_benchmark.py \
            --ignore=tests/test_performance_projection.py \
            --ignore=tests/test_platform.py \
            --ignore=tests/test_system.py \
            --ignore=tests/test_replay_lookahead.py \
            --ignore=tests/test_news_sentiment.py \
            --ignore=tests/test_walk_forward_microtest.py \
            --tb=short

  safety:
    runs-on: windows-latest
    timeout-minutes: 10
    # Always run safety checks, even if unit tests failed
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Critical safety tests
        run: |
          python -m pytest \
            tests/test_mt5_owner.py \
            tests/test_exposure.py \
            tests/test_kelly_sizing.py \
            tests/test_account_mode.py \
            tests/test_fast_mode.py \
            -q --tb=short
