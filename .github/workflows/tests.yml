name: Tests

on:
  push:
    branches: [main, "MT5_Quant_Agent_P0_Repaired_2026-08-04", "agent/*"]
  pull_request:
    branches: [main, "MT5_Quant_Agent_P0_Repaired_2026-08-04"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest psutil

      - name: Run tests
        run: |
          python -m pytest tests/ -q --ignore=tests/test_end_to_end.py --ignore=tests/test_performance_benchmark.py --tb=short

      - name: Verify critical safety tests
        run: |
          python -m pytest tests/test_mt5_owner.py tests/test_exposure.py tests/test_kelly_sizing.py tests/test_account_mode.py tests/test_fast_mode.py -q --tb=short
