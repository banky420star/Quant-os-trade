# 2026-07-31 — LLM news-sentiment SHADOW risk filter (cycle-19 pipeline wired
# live). Default OFF. When enabled, loops/news fetches recent RSS headlines,
# classifies polarity via Ollama/LLM, and writes state/news_sentiment_snapshot.json.
# The verifier exposes a 'news_sentiment' check that ALWAYS passes while
# sentiment_gate=false (shadow/observe). Turn sentiment_gate=true to hard-reject
# risk-on entries against a strong bearish macro-news backdrop (and vice versa).
# Research found NO tradeable news edge at 30bps — this is risk hygiene, not alpha.
news:
  enabled: true
  sentiment_gate: false
  source: rss
  sentiment: auto
  ollama_model: kimi-k2.5:cloud
  # 2026-08-04 — enabled: true + sentiment_gate: false = shadow mode.
  # News sentiment is fetched and displayed on the dashboard but NEVER
  # blocks trades. This is risk hygiene (observability), not alpha.
  # refresh_interval_seconds defaults to 900 (15 min).
  lookback_hours: 24
  max_items_per_theme: 10
  themes: ["inflation", "employment", "taxes", "war"]
  strong_hint_threshold: 0.4
  strong_hint_min_items: 3
learning:
  enabled: true
  mode: live_apply_limited
  loop_interval_seconds: 120
  review_lookback: 25
  proposal_min_sample: 3
  tp_early_atr_threshold: 0.3
