mode: growth
culturing:
  min_n: 8
  veto_win_rate_pct: 40
  cost_r: 0.0
  # 2026-07-31 — cost-aware veto: paper_cost_r applies ONLY to records without
  # an mt5_deal (paper-simulated, mid-price entries whose R omits the spread).
  # Fill records keep cost_r=0 (spread already in the fill). 0.0 = unchanged.
  paper_cost_r: 0.0
  # 2026-07-31 — Thompson-sampling bandit over culturing cells (SHADOW).
  # Replaces the hard binary veto with a continuous posterior + sampled
  # selection score in state/culturing_bandit.json. Default OFF; even when
  # enabled it does NOT gate trades (apply_shadow=false) — observe only.
  bandit:
    enabled: false
    apply_shadow: false
    prior_mean_r: 0.0
    prior_weight: 8.0
    thin_exploration_scale: 1.0
    min_n: 8
  # 2026-07-31 — setup-level aggregate veto. The per-cell culturing veto above
  # fragments evidence across ~50 (symbol|setup|regime|align|session) cells, so
  # a setup that loses in aggregate (pullback was 66% of all trades, 33% win rate,
  # the #1 loss driver per the MT5-journal review) never trips a per-cell veto.
  # This coarser gate looks at each setup's FULL sample and vetoes proven losers.
  # min_n=100 (high) so a setup-level call is only made on real evidence.
  setup_aggregate_veto:
    enabled: true
    min_n: 100
    veto_win_rate_pct: 40
    veto_net_r: 0.0
adaptation:
  enabled: true
  calibrate_be_trail: true
  rebuild_trade_log: true
  adaptive_gates:
    enabled: true
    lookback: 15
    min_sample: 5
    # 2026-08-03 — relaxed: defensive tier previously re-tripped on a $1000
    # micro account's small absolute losses and blocked XAUUSDm's 92.5-score
    # candidates. Triggers now require genuinely bad performance: WR floor
    # lowered, net-PnL floor made deeper, consecutive-loss bar raised, and
    # per-symbol auto-block made less twitchy. Score/confidence tightening
    # when defensive is also reduced so approved candidates still clear gates.
    cautious_win_rate: 30
    defensive_win_rate: 15
    defensive_consecutive: 6
    cautious_net_pnl: -10
    defensive_net_pnl: -30
    symbol_net_block_pnl: -15
