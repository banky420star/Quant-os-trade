execution:
  # 2026-07-21 v2: re-enabled live at user's explicit request, but with the
  # survival belt intact: max_loss_per_trade halved 10 -> 5 and a 5% daily
  # loss cap added under risk. Expectancy is still -0.49R per trade (WR=31.4%
  # / payoff=0.63 over 428 closes), so the user is paying USD for time, not
  # for profit. BTCUSDm is removed from practice.micro.symbols so the
  # residual 2 BTCUSDm SELL ghost positions don't veto the 13 healthy
  # symbols via the exposure gate.
  mode: mt5
  mt5_trading_enabled: true
  allow_live_account: true
  # 2026-08-04 — safety guard (reverse of allow_live_account): when
  # mt5.account_mode is real/live but the connected MT5 account is a demo
  # trial, the bot REFUSES to trade (the "LIVE" banner would be a lie). Set
  # this to true ONLY to run demo orders under a live profile on purpose.
  allow_demo_when_live_config: false
  live_trading_enabled: true
  default_lot: 0.01
  max_lot: 0.5
  magic_number: 20250625
  deviation: 20
  starting_cash: 100
  market_closed_backoff_minutes: 5
risk:
  unlimited_trades: false
  # 2026-07-21 v2: 3500 -> 4500 to absorb the $2656 BTCUSDm ghost exposure
  # without vetoing the other 13 symbols (per-symbol cap is structurally
  # higher than the residual so any 0.01-lot live entry on the 13 active
  # symbols still gets through).
  max_symbol_exposure_usd: 4500
  # 2026-07-21 v2: tightened 15000 -> 8000 to keep total book risk roughly
  # proportional to per-trade budget; the 13-symbol universe has fractional
  # caps that prevent this from binding under normal flow.
  max_total_exposure_usd: 8000
  # 2026-07-21 v2: 20% with the new $5 max_loss_per_trade gives ~5 losing XAU
  # trips (or ~7 USDJPY/USDCHF trips) of headroom before kill. P(N=5
  # consecutive losses | WR=31.4%) = 0.686^5 = 15%, so this absorbs normal
  # variance without tripping on the first sample.
  max_drawdown_pct: 20
  # 2026-07-24: restored 10% -> 5%. Daily loss cap is the primary
  # risk-of-ruin control on a small account; pause the day before equity
  # drag cascades. 5% of $100 = $5/day.
  max_daily_loss_pct: 5
  max_order_age_minutes: 30
  kill_switch: false
  # 2026-07-21 v2: raised 0 -> 4. P(N=4 consecutive losses | WR=31.4%) = 22%,
  # i.e. a 1-in-5 session triggers this naturally, vs P(N=0)=68% which would
  # pause the bot on the very first rejection. 4 consecutive losses on
  # $5/trade = $20 = 16% drawdown, still safely below the 20% kill.
  max_consecutive_losses: 4
  # 2026-07-22: Daily profit halt — flips kill_switch and stops opening NEW
  # trades once today's realized PnL >= this USD. Auto-resets at UTC midnight
  # (the kill_switch.json carries a day_stamp key that the gate checks). Set
  # to 0 (or omit) to disable. Floating/unrealized PnL does NOT count — only
  # closed-trade PnL.  See core/daily_pnl.py + execution_loop._check_execution_allowed.
  # 2026-07-24: scaled 400 -> 15 to be reachable on the ~$100-125 micro
  # account (~12% day). 400 was calibrated for a $5k demo and could never fire.
  daily_profit_halt_usd: 15
  # 2026-07-31 — HARD equity-fraction per-trade risk cap (micro-account ruin
  # guard). See core/position_sizing.py:calc_executable_volume. Unconditional:
  # rejects any trade whose realized SL risk at the final (possibly min-lot-
  # floored) volume exceeds this % of equity. Prevents a single stop-out from
  # wiping a micro-account when min-lot risk > equity (e.g. 0.01-lot NAS100m =
  # ~$104 SL risk on a ~$100 account — the 2026-07-30 wipe). Independent of
  # max_loss_per_trade_usd / cap_loss_to_balance (unset in growth →
  # effective_risk_cap returns None → the per-trade cap gate was skipped).
  # On a $100 account, 5% = $5 max risk/trade → index CFDs whose min-lot risk
  # exceeds that are correctly rejected as un-tradable at this account size.
  enforce_equity_risk_cap: true
  max_risk_per_trade_pct: 5
