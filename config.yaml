# USER-AUTHORIZED 2026-07-01: explicit profile selector (single canonical label
# for which profile is active). core/profile_guard.py refuses to boot if this
# disagrees with the live account (a real account MUST be mode: live). The
# scattered knobs (performance.apply_when, practice.growth, etc.) still drive
# the derived profile; this field is the human-readable label the guard checks.
# growth = aggressive prop-firm-eval practice (demo only); live = conservative
# performance plan (real); practice = neutral paper.
mode: growth
# Data-driven per-symbol culturing config (loops/forward_test_loop.py). A cell
# is vetoed (verifier hard-rejects it) only when n >= min_n AND realized net
# expectancy < 0 AND win-rate < veto_win_rate_pct. cost_r=0 by default because
# live trades' realized R already includes the real spread.
culturing:
  min_n: 8
  veto_win_rate_pct: 40
  cost_r: 0.0
# Bot develops from live closes — vetoes, BE/trail, rankings update when conditions met.
adaptation:
  enabled: true
  calibrate_be_trail: true
  rebuild_trade_log: true
app:
  name: mt5_quant_os
  display_name: MT5 Quant OS
  version: '1.0'
  loop_interval_seconds: 45
  dashboard:
    enabled: true
    host: 0.0.0.0
    port: 8080
    auto_open_browser: false
    refresh_seconds: 2
  supervisor:
    heartbeat_seconds: 10
    history_interval_seconds: 300
    research_interval_seconds: 1800
    restart_delay_seconds: 5
mt5:
  # Attaches to whatever account YOU logged into in the MT5 terminal window.
  # Never set login/password/server here (or in config.local.yaml) unless you
  # intentionally want forced re-login — use_logged_in_account blocks that.
  use_logged_in_account: true
  ignore_stored_credentials: true
  account_mode: demo
  path: C:\Users\Administrator\MT5Agent\terminal64.exe
  prefer_logged_in_session: true
  timeout_ms: 60000
  # Arena campaign symbols (strategy_arena.symbols overrides when arena enabled).
  symbols:
  - XAUUSDm
  - USOILm
  - BTCUSDm
  - EURUSDm
  - GBPUSDm
  - USDJPYm
  - USDCHFm
  - AUDUSDm
  - US500m
  - US30m
  - NAS100m
  - UK100m
  - FR40m
  - JP225m
  timeframes:
    entry: M5
    bias: M15
  candles: 300
  auto_launch_terminal: false
features:
  use_history_lookback: true
  history_lookback_bars: 500
  min_bars_required: 20
history:
  enabled: true
  max_bars: 50000
  chunk_size: 5000
  incremental_bars: 500
  update_mode: incremental
health:
  max_candle_age_minutes: 30
trading:
  aggressive_mode: false
  allow_pyramiding: true
  pyramid_block_same_setup: false
  max_open_per_symbol: 5
  # USER-AUTHORIZED 2026-06-29: tightened 10->3 after -27% drawdown tripped the
  # kill switch. Still allows pyramiding up to 3/symbol; exposure cap re-enabled.
  # Confidence floor: a new position must be >= the strongest open position's
  # confidence. Don't add a weaker trade on top of stronger ones.
  confidence_floor_vs_open: false
  # USER-AUTHORIZED 2026-06-30: regime-flip trade replacement. When M15 trend
  # AND market_regime bias BOTH flip (bullish<->bearish) vs the prior tick, and a
  # new approved signal fires with confidence >= regime_flip_min_confidence in
  # the OPPOSITE direction to an OPEN position that is currently LOSING
  # (profit<0), the broker closes that losing position and places the new
  # opposite-direction signal as its replacement. Cuts losers on a confirmed
  # turn; never cuts a winning runner. Direction state in
  # state/regime_history.json (written by market_context_loop each tick).
  regime_flip_replace_enabled: false
  regime_flip_min_confidence: 75
  regime_flip_window_sec: 90
  max_session_trades_per_symbol: 12
  strategy_entries:
    enabled: true
    use_limit_orders: false
    entry_buffer_atr: 0.05
    market_if_within_atr: 99.0
    max_entry_wait_atr: 2.0
    # Per-symbol SL/TP calibration (USER request 2026-07-01). The SL distance
    # is already ATR-scaled (auto-adapts to each symbol's volatility), but the
    # ATR multiplier for the stop and the RR (TP1/TP2 in R) were hardcoded
    # globally. Here they are seeded by symbol class: FX mean-reverts so a
    # tighter RR hits more often; gold/oil trend with fat tails so a wider SL
    # and RR capture more; BTC is the fattest-tailed so widest. A data-driven
    # override (scripts/calibrate_sltp.py -> state/symbol_sltp_live.json) wins
    # over these seeds once a symbol has n>=min_n clean trades and a candidate
    # that beats the seeded default's expectancy. See core/strategy_entry.py
    # _sltp_cfg.
    sl_tp:
      sl_atr_mult: 0.5          # stop placed this many ATR beyond structure
      risk_floor_atr_mult: 1.5  # minimum stop distance in ATR
      risk_floor_pct: 0.001     # minimum stop distance as a fraction of price
      tp1_rr: 1.5               # TP1 in R
      tp2_rr: 2.5               # TP2 in R
      per_symbol:
        # FX majors: tight, mean-reverting — modest RR, normal SL.
        EURUSDm: { sl_atr_mult: 0.4, risk_floor_atr_mult: 1.2, tp1_rr: 1.2, tp2_rr: 2.0 }
        GBPUSDm: { sl_atr_mult: 0.4, risk_floor_atr_mult: 1.2, tp1_rr: 1.2, tp2_rr: 2.0 }
        USDJPYm: { sl_atr_mult: 0.4, risk_floor_atr_mult: 1.2, tp1_rr: 1.2, tp2_rr: 2.0 }
        USDCHFm: { sl_atr_mult: 0.4, risk_floor_atr_mult: 1.2, tp1_rr: 1.2, tp2_rr: 2.0 }
        AUDUSDm: { sl_atr_mult: 0.4, risk_floor_atr_mult: 1.2, tp1_rr: 1.2, tp2_rr: 2.0 }
        # Gold / oil: trending, wider RR + slightly wider floor.
        XAUUSDm:  { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.6, tp2_rr: 2.8 }
        USOILm:   { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.6, tp2_rr: 2.8 }
        # US indices: trending, moderate.
        US500m:   { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.8, tp2_rr: 3.0 }
        US30m:    { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.8, tp2_rr: 3.0 }
        NAS100m:  { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.8, tp2_rr: 3.0 }
        UK100m:   { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.6, tp2_rr: 2.8 }
        FR40m:    { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.6, tp2_rr: 2.8 }
        JP225m:   { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.6, tp1_rr: 1.6, tp2_rr: 2.8 }
        # Crypto: fattest tails — widest SL + RR so the stop survives noise.
        BTCUSDm:  { sl_atr_mult: 0.7, risk_floor_atr_mult: 2.0, tp1_rr: 2.0, tp2_rr: 3.5 }
  dynamic_entries:
    enabled: false
    require_positive_stack_pnl: true
    require_favorable_price: true
    min_atr_distance_from_last: 0.08
    scale_lot_factor: 0.9
