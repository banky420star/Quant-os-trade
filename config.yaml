# ---------------------------------------------------------------------------
# Self-learning loop (2026-07-24). OBSERVE-ONLY: reward-weighted weight
# candidates + learning self-monitor (rollback recommendation) + bounded
# shadow experiments. Proposes and reports; never trades or writes live
# config on its own. See core/reward_engine.py, core/learning_monitor.py,
# core/shadow_experiment.py, loops/self_learning_loop.py.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Conviction engine (2026-07-24) — grade every setup like a professional.
# Each candidate is graded A+/A/B/C on confluence (trend alignment, reward:risk,
# regime fit, session, historical edge, confirmation, confidence). Risk sizing
# scales with the grade, and setups below `min_grade_to_trade` are skipped.
# size_by_grade multipliers are <= 1.0 by default: conviction only trims risk
# on weaker setups. Raise A+ above 1.0 to upsize the best ideas (still clamped
# by per-trade + exposure caps). See core/conviction.py.
# ---------------------------------------------------------------------------
conviction:
  enabled: true
  # Floor grade the bot will actually trade. "C" = trade everything but size
  # weak setups down; raise to "B" or "A" to become progressively more
  # selective (a pro trades less, and better).
  # 2026-07-24: set to B as the recommended professional default — skip the
  # low-conviction C setups entirely, take fewer/better trades. Drop back to
  # C if you want maximum trade frequency (weak setups still auto-sized-down).
  min_grade_to_trade: B
  size_by_grade:
    "A+": 1.0
    "A": 1.0
    "B": 0.6
    "C": 0.3

self_learning:
  enabled: true
  loop_interval_seconds: 300
  # Minimum closed trades before the reward-weighted weight optimizer will
  # emit a candidate (below this it returns the baseline, status=insufficient).
  min_trades: 15
  # Per-symbol tick/outcome learner. Shadow-only: proposals are persisted for
  # replay/paper validation and never alter live config or order sizing.
  adaptive_symbol_learning:
    enabled: true
    mode: shadow
    tick_sample_seconds: 5
  # Bounded paper-only forward experiments. Signals are deterministically split
  # between a control sample and candidate arms; tags flow into paper_trades.json
  # for scoring. This never routes MT5/live orders and stays off unless explicitly
  # enabled for paper validation.
  shadow_experiments:
    routing_enabled: false
    control_fraction: 0.50
    lookback: 200
    min_trades: 20
    max_risk_multiplier_up: 1.10
    max_risk_multiplier_down: 0.50
    high_spread_atr_ratio: 0.20
    weak_volume_ratio: 0.80
    validation:
      enabled: true
      min_forward_trades: 25
      min_control_trades: 5
      min_reward_margin: 0.30
      min_expectancy_r: 0.0
      # Validation is paper-only and never auto-promotes to live config.
      operator_approval_required: true

# ---------------------------------------------------------------------------
# Strategy diversification: 4 uncorrelated signal streams + meta-decision.
# Added 2026-07-22 — Donchian trend + Bollinger FX reversion + ATR-volatility
# expansion + the existing Decision Engine. Each stream sized via risk-parity.
# ---------------------------------------------------------------------------
strategies:
  diversification:
    enabled: true
    per_symbol_cap: 1
    min_meta_score: 0.20
    cooldown_seconds: 180
    risk_shares:
      donchian_breakout:   0.25
      bollinger_reversion: 0.25
      atr_expansion:       0.25
      decision_engine:     0.25
    donchian_enabled: true
    donchian:
      entry_len: 20
      exit_len: 10
      atr_len: 14
      atr_threshold: 0.0005
      use_double_band: true
      rr: 1.8
      sl_atr: 1.5
      donchian_symbols: []  # empty = all symbols
    bollinger_enabled: true
    bollinger:
      period: 20
      std_mult: 2.0
      atr_len: 14
      atr_threshold: 0.0005
      rr: 0.8
      sl_atr: 1.0
      require_stoch: true
      bollinger_symbols: []  # empty = FX only (EURUSDm/GBPUSDm/USDJPYm/USDCHFm/AUDUSDm)
    atr_expansion_enabled: true
    atr_expansion:
      breakout_len: 14
      atr_len: 14
      atr_ratio_lookback: 20
      expansion_mult: 1.2
      rr: 2.0
      sl_atr: 1.0
      atr_expansion_symbols: []  # empty = all symbols
