# $30 micro account — Culturing Evolution (best-of-n winner) + aggressive edge sessions
label: "$30 Micro"
description: "Aggressive edge sessions on XAUUSDm/USOILm/UK100m, 0.01 lot, $10 max loss, positive-evolution"
mode: growth
trading:
  aggressive_mode: true
  # USER request 2026-07-12: disable trailing stop for now
  trailing:
    enabled: false
practice:
  relax_structure_checks: true
  relax_volume_check: true
  growth:
    enabled: true
    aggressive_mode: true
    session_scoring_enabled: true
    strategy_ranking_enabled: true
    min_trade_score: 50
    min_trade_score_aggressive: 46
    min_confidence: 50
    min_risk_reward: 0.88
    min_volume_ratio: 0.10
    spread_mult: 3.0
    relax_consensus: true
    risk_veto_threshold: 10
    daily_target_pct: 20
    max_daily_loss_pct: 10
    risk_percent_per_trade: 1.0
    max_lot: 0.01
    max_session_trades_per_symbol: 8
  micro:
    enabled: true
    aggressive_mode: true
    account_size_usd: 30
    symbols: [XAUUSDm, USOILm, UK100m]
    max_open_per_symbol: 1
    max_open_per_setup: 1
    allow_pyramiding: false
    default_lot: 0.01
    max_lot: 0.01
    risk_percent_per_trade: 1.0
    daily_target_pct: 20
    max_daily_loss_pct: 10
    max_drawdown_pct: 20
    max_symbol_exposure_fraction: 0.40
    max_total_exposure_fraction: 0.60
    max_session_trades_per_symbol: 6
    max_loss_per_trade_usd: 10
    cap_loss_to_balance: true
    reentry_cooldown_seconds: 30
    entry_confirm_seconds: 30
    trailing:
      enabled: true   # trailing ON but tuned to maximize profit
      # Activate later (trade well in profit before trailing starts)
      # Trail looser (give winners room to breathe, don't get stopped on pullbacks)
      activation_profit_usd: 2
      activation_atr_mult: 0.75   # was 0.35 ? activate at 0.75 ATR profit
      trail_points_atr_mult: 0.6  # was 0.28 ? looser trail so winners run
      per_symbol:
        XAUUSDm:
          activation_profit_usd: 2
          activation_atr_mult: 0.75
          trail_points_atr_mult: 0.6  # was 0.28 ? let gold breathe
        USOILm:
          activation_profit_usd: 1.5
          activation_points: 18    # was 8 ? activate later
          trail_points: 25        # was 10 ? looser trail
        UK100m:
          activation_profit_usd: 2
          activation_atr_mult: 0.6  # was 0.3
          trail_points_atr_mult: 0.5  # was 0.2 ? let FTSE breathe
    regime_flip_replace_enabled: true
    regime_flip_min_confidence: 65
    regime_flip_window_sec: 90
    avoid_news: true
    campaign_days: 30
    positive_evolution_enabled: true
    positive_evolution:
      enabled: true
      min_n: 6
      min_expectancy_net_r: 0.0
      edge_db_min_samples: 5
      edge_db_min_win_rate_pct: 55
    symbol_rules:
      XAUUSDm:
        allowed_setups: [pullback]
        preferred_setups: [pullback]
        preferred_sessions: [rollover, tokyo]
        strict_sessions: false
      USOILm:
        allowed_setups: [pullback]
        preferred_setups: [pullback]
        preferred_sessions: [tokyo]
        strict_sessions: false
      UK100m:
        allowed_setups: [trend_continuation, pullback]
        preferred_setups: [trend_continuation, pullback]
        preferred_sessions: [london_open]
        strict_sessions: false
