label: MT5 Ownership Validation
description: >-
  Safe read-only run for the 2026-08-04 MT5 single-owner repair. Attaches to the
  demo account and runs data / feature / context / position-sync / dashboard /
  journal services, but sends ZERO orders: execution.live_trading_enabled=false,
  fast mode off, and position management skipped at the loop level. Use this to
  verify the shared MT5Owner session stays stable (no per-tick connect/disconnect,
  exactly one initialize/shutdown) before re-enabling execution.
mode: practice
mt5:
  account_mode: demo
  use_logged_in_account: true
  ignore_stored_credentials: true
  symbols:
  - XAUUSDm
execution:
  mode: mt5
  live_trading_enabled: false
  mt5_trading_enabled: false
  explicit_opt_in_danger_zone: false
  default_lot: 0.01
  max_lot: 0.01
  magic_number: 20250625
practice:
  micro:
    enabled: false
  growth:
    enabled: false
  symbols:
  - XAUUSDm
fast_mode:
  enabled: false
  live_enabled: false
  symbols:
  - XAUUSDm
  max_open_positions: 1
trading:
  aggressive_mode: false
  allow_pyramiding: false
  max_open_per_symbol: 1
  dynamic_entries:
    enabled: false
  adaptive_exit:
    enabled: false
  break_even:
    enabled: false
  trailing:
    enabled: false
  exits:
    partial_tp:
      enabled: false
performance:
  apply_when: never
signals:
  specialized_setups:
    enabled: false
    shadow: false
strategy_arena:
  enabled: false
blue_guardian:
  enabled: false
canary:
  enabled: false
trade_manager:
  enabled: false
  ghost_enabled: false
  stale_close_enabled: false
self_learning:
  adaptive_symbol_learning:
    enabled: false
thesis_reviewer:
  live_close_enabled: false
