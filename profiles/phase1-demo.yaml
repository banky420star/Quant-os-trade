label: "Phase 1 Fresh-Market Demo"
description: >-
  Fresh-market demo validation profile. Ships UNARMED. It enables the M1
  shadow structure service and a single-symbol demo data path, but no MT5
  order may be sent until the operator explicitly arms the existing execution
  gates for a demo-only routing rehearsal.
mode: practice
practice:
  micro:
    enabled: false
  growth:
    enabled: false
mt5:
  account_mode: demo
  use_logged_in_account: true
  ignore_stored_credentials: true
  symbols:
  - XAUUSDm
execution:
  mode: mt5
  live_trading_enabled: false
  mt5_trading_enabled: false
  explicit_opt_in_danger_zone: false
  default_lot: 0.01
  max_lot: 0.01
  magic_number: 20250625
fast_mode:
  enabled: false
  live_enabled: false
  symbols:
  - XAUUSDm
  max_open_positions: 1
m1_structure:
  enabled: true
  max_data_age_seconds: 90
  loop_interval_seconds: 10
  candle_refresh_interval_seconds: 10
trading:
  aggressive_mode: false
  allow_pyramiding: false
  max_open_per_symbol: 1
  max_session_trades_per_symbol: 3
  dynamic_entries:
    enabled: false
  adaptive_exit:
    enabled: false
  break_even:
    enabled: false
  trailing:
    enabled: false
  exits:
    partial_tp:
      enabled: false
learning:
  enabled: true
  mode: observe_only
adaptation:
  enabled: false
policy_optimizer:
  enabled: true
  mode: shadow
policy_detection:
  enabled: true
  mode: shadow
signals:
  specialized_setups:
    enabled: false
    shadow: true
strategy_arena:
  enabled: false
blue_guardian:
  enabled: false
canary:
  enabled: false
trade_manager:
  enabled: false
  ghost_enabled: false
  promote_enabled: false
  stale_close_enabled: false
self_learning:
  adaptive_symbol_learning:
    enabled: false
thesis_reviewer:
  live_close_enabled: false
app:
  remote_access:
    enabled: false
  dashboard:
    host: 127.0.0.1
