label: "Phase 1 Full Demo Execution"
description: >-
  Explicitly armed DEMO-only execution profile for broad forward testing across
  the full configured symbol universe. It removes the one-symbol / one-position /
  0.01-lot canary clamps, allows multiple concurrent entries and pyramiding, and
  restores break-even plus trailing management. Normal verifier, broker-native
  sizing, kill-switch, duplicate-order, and account-mode protections remain in
  force. Real accounts remain refused by allow_live_account=false.
mode: practice
practice:
  symbols:
  - XAUUSDm
  - USOILm
  - BTCUSDm
  - EURUSDm
  - GBPUSDm
  - USDJPYm
  - USDCHFm
  - AUDUSDm
  - US500m
  - US30m
  - NAS100m
  - UK100m
  - FR40m
  - JP225m
  require_top_ranked_setup: false
  max_symbol_exposure_usd: 1000000
  max_total_exposure_usd: 10000000
  max_drawdown_pct: 100
  micro:
    enabled: false
  growth:
    enabled: false
mt5:
  account_mode: demo
  use_logged_in_account: true
  ignore_stored_credentials: true
  symbols:
  - XAUUSDm
  - USOILm
  - BTCUSDm
  - EURUSDm
  - GBPUSDm
  - USDJPYm
  - USDCHFm
  - AUDUSDm
  - US500m
  - US30m
  - NAS100m
  - UK100m
  - FR40m
  - JP225m
execution:
  mode: mt5
  live_trading_enabled: true
  mt5_trading_enabled: true
  explicit_opt_in_danger_zone: true
  allow_live_account: false
  default_lot: 0.01
  max_lot: 0.5
  magic_number: 20250625
fast_mode:
  enabled: false
  live_enabled: false
m1_structure:
  enabled: true
  max_data_age_seconds: 90
  loop_interval_seconds: 10
  candle_refresh_interval_seconds: 10
trading:
  aggressive_mode: true
  allow_pyramiding: true
  max_open_per_symbol: 5
  max_session_trades_per_symbol: 50
  regime_flip_replace_enabled: false
  dynamic_entries:
    enabled: true
  adaptive_exit:
    enabled: true
  break_even:
    enabled: true
  trailing:
    enabled: true
  exits:
    partial_tp:
      enabled: false
learning:
  enabled: true
  mode: observe_only
adaptation:
  enabled: false
policy_optimizer:
  enabled: true
  mode: shadow
policy_detection:
  enabled: true
  mode: shadow
signals:
  specialized_setups:
    enabled: false
    shadow: true
strategy_arena:
  enabled: false
blue_guardian:
  enabled: false
canary:
  enabled: false
trade_manager:
  enabled: false
  ghost_enabled: false
  promote_enabled: false
  stale_close_enabled: false
self_learning:
  adaptive_symbol_learning:
    enabled: false
thesis_reviewer:
  live_close_enabled: false
app:
  remote_access:
    enabled: false
  dashboard:
    host: 127.0.0.1
