label: "Phase 1 Full Demo Execution"
description: >-
  Explicitly armed DEMO-only execution profile for broad forward testing across
  30 liquid, fast-moving Exness-style instruments. It allows multiple concurrent
  entries and pyramiding, restores break-even plus trailing management, and uses
  per-symbol SL/TP and trail settings. Gold uses a fixed 2100-point trail and BTC
  a fixed 8000-point trail once price moves at least one broker point in profit.
  Normal verifier, broker margin checks, kill-switch, duplicate-order, and
  account-mode protections remain in force. Real accounts remain refused by
  allow_live_account=false.
mode: practice
practice:
  symbols:
  - XAUUSDm
  - XAGUSDm
  - BTCUSDm
  - ETHUSDm
  - USOILm
  - UKOILm
  - XNGUSDm
  - EURUSDm
  - GBPUSDm
  - USDJPYm
  - USDCHFm
  - AUDUSDm
  - USDCADm
  - NZDUSDm
  - EURJPYm
  - GBPJPYm
  - EURGBPm
  - EURAUDm
  - EURCADm
  - AUDJPYm
  - CADJPYm
  - US500m
  - US30m
  - NAS100m
  - UK100m
  - FR40m
  - DE30m
  - JP225m
  - HK50m
  - AUS200m
  require_top_ranked_setup: false
  max_symbol_exposure_usd: 1000000
  max_total_exposure_usd: 10000000
  max_drawdown_pct: 100
  micro:
    enabled: false
  growth:
    enabled: false
mt5:
  account_mode: demo
  use_logged_in_account: true
  ignore_stored_credentials: true
  symbols:
  - XAUUSDm
