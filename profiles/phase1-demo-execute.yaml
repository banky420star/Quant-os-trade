  live_trading_enabled: true
  mt5_trading_enabled: true
  explicit_opt_in_danger_zone: true
  allow_live_account: false
  default_lot: 0.01
  # High-throughput DEMO ceiling. The sizing engine and MT5 margin/order checks
  # still determine whether a requested volume is executable for each symbol.
  max_lot: 100.0
  magic_number: 20250625
fast_mode:
