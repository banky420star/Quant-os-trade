# Real-money micro — live equity sizing, aligned verifier/execution gates
label: "$30 Micro Live"
description: "REAL account micro — XAU/Oil/UK100, 0.01 lot, $10 max loss, positive-evolution"
mode: live
mt5:
  account_mode: real
  use_logged_in_account: true
  ignore_stored_credentials: true
performance:
  apply_when: never
trading:
  aggressive_mode: true
  # USER-AUTHORIZED 2026-07-09: per-symbol setup improvements from the loss
  # review. Fix the diagnosed loss causes instead of vetoing setups forever.
  sl_tp:
    per_symbol:
      XAUUSDm:  { sl_atr_mult: 0.5, risk_floor_atr_mult: 1.0, tp1_rr: 1.3, tp2_rr: 2.4 }
      USOILm:   { sl_atr_mult: 0.55, risk_floor_atr_mult: 1.0, tp1_rr: 1.3, tp2_rr: 2.4 }
      UK100m:   { sl_atr_mult: 0.6, risk_floor_atr_mult: 1.0, tp1_rr: 1.2, tp2_rr: 2.0 }
  # Tighter hard kill: 8% drawdown from the rebaselined $89.70 (~$7) trips the
  # kill switch and stops new orders. Caps the downside on this small account.
risk:
  max_drawdown_pct: 15
  max_order_age_minutes: 30
  kill_switch: false  # auto-managed: trips at 15% drawdown
  strategy_entries:
    use_limit_orders: true
    refresh_each_cycle: true
    reject_unreachable_entries: true
    skip_at_capacity_in_candidates: true
    market_if_within_atr: 0.35
    max_entry_wait_atr: 1.0   # balanced: allow moderate entries, not extreme chasing
practice:
  relax_structure_checks: true
  relax_volume_check: true
  max_drawdown_pct: 15  # 15% drawdown from $60.47 (~$9) trips the kill
  # USER-AUTHORIZED aggressive: lower entry bar so more setups trigger.
  min_confidence: 42
  min_risk_reward: 0.75
  min_trade_score: 20
  min_trade_score_aggressive: 20
  growth:
    enabled: false
  micro:
    enabled: true
    live_mode: true
    growth_enabled: false
    aggressive_mode: true
    disable_arena: true
    # Live equity read from state/account.json at runtime (fallback if missing)
    account_size_usd: 37
    symbols: [XAUUSDm, USOILm, UK100m]
    max_open_per_symbol: 1
    max_open_per_setup: 1
    allow_pyramiding: false
    default_lot: 0.01
    max_lot: 0.01
    risk_percent_per_trade: 1.0
    daily_target_pct: 20
    max_daily_loss_pct: 10
    max_drawdown_pct: 15
    # Each symbol trades on its own SL-risk budget; total cap = 3× equity for reporting
    independent_symbol_exposure: true
    max_symbol_exposure_fraction: 1.0
    max_total_exposure_fraction: 3.0
    max_session_trades_per_symbol: 6
    max_loss_per_trade_usd: 10
    cap_loss_to_balance: true
    reentry_cooldown_seconds: 30
    entry_confirm_seconds: 30
    regime_flip_replace_enabled: true
    regime_flip_min_confidence: 65
    regime_flip_window_sec: 90
    avoid_news: true
    campaign_days: 30
    positive_evolution_enabled: true
    positive_evolution:
      enabled: true
      min_n: 6
      min_expectancy_net_r: 0.0
      edge_db_min_samples: 5
      edge_db_min_win_rate_pct: 55
    symbol_rules:
      XAUUSDm:
        allowed_setups: [pullback]
        preferred_setups: [pullback]
        preferred_sessions: [london_open, overlap_london_ny, london_mid, new_york, tokyo]
        strict_sessions: false
        # Broker min lot (0.01); volatile pullback SL can reach ~$30 on live gold
        max_loss_per_trade_usd: 30
      USOILm:
        allowed_setups: [pullback, trend_continuation]
        preferred_setups: [trend_continuation, pullback]
        preferred_sessions: [tokyo, new_york, overlap_london_ny, london_open]
        strict_sessions: false
      UK100m:
        allowed_setups: [trend_continuation, pullback]
        preferred_setups: [trend_continuation, pullback]
        preferred_sessions: [london_open, overlap_london_ny, london_mid]
        strict_sessions: false
culturing:
  min_n: 6
  veto_win_rate_pct: 45
  cost_r: 0.0
  promote_min_n: 4
  promote_min_win_rate_pct: 0
  promote_min_expectancy_r: 0.03
adaptation:
  enabled: true
  calibrate_be_trail: true
  rebuild_trade_log: true
  refresh_positive_evolution: true
  auto_evolve_cells: true
  evolve_symbols: [XAUUSDm, USOILm, UK100m]
  seed_edge_cells:
    - symbol: XAUUSDm
      setup: pullback
      sessions: [rollover, tokyo]
    - symbol: USOILm
      setup: pullback
      sessions: [tokyo]
    - symbol: UK100m
      setup: trend_continuation
      sessions: [london_open]
    - symbol: UK100m
      setup: pullback
      sessions: [london_open]
quant:
  positive_evolution_enabled: true
  positive_evolution:
    enabled: true
    min_n: 6
    min_expectancy_net_r: 0.0
  strategy_ranking_enabled: true
  require_top_ranked_setup: false
  ranking_flex_enabled: true
  ranking_flex_min_win_rate: 0
  ranking_flex_min_samples: 6
  ranking_flex_top_n: 2
  ranking_context_align: true
  min_rank_sample_size: 3
  min_rank_win_rate: 0
  cell_veto_demote: true
  per_symbol:
    XAUUSDm:
      require_top_ranked_setup: false
      min_rank_win_rate: 0
      min_rank_sample_size: 3
      preferred_setups: [trend_continuation, pullback]
      preferred_sessions: [london_open, overlap_london_ny, london_mid, new_york, tokyo]
    USOILm:
      require_top_ranked_setup: false
      min_rank_win_rate: 0
      preferred_setups: [trend_continuation, pullback]
      preferred_sessions: [tokyo, new_york, overlap_london_ny, london_open]
    UK100m:
      require_top_ranked_setup: false
      min_rank_win_rate: 0
      preferred_setups: [trend_continuation, pullback]
      preferred_sessions: [london_open, overlap_london_ny, london_mid]
session_scoring:
  enabled: true
  min_trade_score: 20
  min_trade_score_aggressive: 20
  symbol_session_boost:
    XAUUSDm:
      tokyo: 4
      rollover: 3
    USOILm:
      tokyo: 5
    UK100m:
      london_open: 5
news:
  macro_awareness: true
  macro_blackout_minutes: 15
  sentiment_gate: false
filters:
  avoid_news: true
  news_blackout_minutes: 10
  news_release_times_utc:
    - '12:30'
    - '13:30'
    - '14:00'
    - '14:30'
    - '15:00'
fast_mode:
  enabled: true
  live_enabled: false  # REAL account: fast layer observes only, no live XAU scalping
  tick_interval_ms: 1000
  symbols: [XAUUSDm]
  require_evaluated_signal: true
  require_verifier_approval: true
  allow_market_entries: false
  allow_limit_entries: true
  max_anchor_distance_atr: 0.35
  market_if_distance_atr_below: 0.05
  trigger_zone_atr: 0.08
  max_spread_mult: 1.2
  min_tick_momentum_score: 55
  cancel_stale_seconds: 60
  max_open_positions: 1
  max_trades_per_symbol_per_hour: 4
  max_consecutive_losses_per_symbol: 2
  cooldown_after_loss_seconds: 180
  break_even_fast:
    enabled: false
    trigger_r: 0.25
    lock_r: 0.02
  trail_fast:
    enabled: true
    start_r: 0.45
    atr_mult: 0.35
  emergency_exit:
    enabled: true
    adverse_tick_move_atr: 0.25
    spread_spike_mult: 2.0
intelligence:
  # Improve, don't veto forever: let the improved setups trade and build a new
  # record. Memory veto only re-engages on a large bad sample (>=40 trades).
  memory_veto_win_rate: 25
  memory_veto_min_trades: 40
  memory_veto_cell_win_rate: 35
  memory_veto_cell_min_trades: 20
evaluation:
  # USER-AUTHORIZED: all 3 symbols (XAU + USOIL + UK100). On a $27 account a 0.01
  # XAU loss is ~$6 (22%) so the 15% drawdown kill will halt after one bad XAU
  # trade - that backstop stays on.
  symbol_blocklist: []

execution:
  live_trading_enabled: true
  mt5_trading_enabled: true
strategy_arena:
  enabled: false
research:
  min_trades_for_research: 10
  replay_bars: 300
  replay_step: 12
  auto_deploy: false
signals:
  min_confidence: 42
  min_risk_reward: 0.75
  symbol_rules:
    XAUUSDm:
      allowed_setups: [pullback]
      preferred_setups: [trend_continuation, pullback]
      preferred_sessions: [london_open, overlap_london_ny, london_mid, new_york, tokyo]
      strict_sessions: false
    USOILm:
      allowed_setups: [pullback, trend_continuation]
      preferred_setups: [trend_continuation, pullback]
      preferred_sessions: [tokyo, new_york, overlap_london_ny, london_open]
      strict_sessions: false
    UK100m:
      allowed_setups: [trend_continuation, pullback]
      preferred_setups: [trend_continuation, pullback]
      preferred_sessions: [london_open, overlap_london_ny, london_mid]
      strict_sessions: false